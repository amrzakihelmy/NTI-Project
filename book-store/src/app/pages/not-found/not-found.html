<div class="not-found-wrapper d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="card not-found-card text-center p-4 p-md-5">
    <div class="not-found-code mb-3">404</div>
    <h1 class="h2 text-main fw-bold mb-3">Page Not Found</h1>
    
    <p class="text-secondary-custom mb-4 mx-auto not-found-desc">
      Oops! The page you are looking for might have been removed.
    </p>

    <a [routerLink]="['/home']" class="btn btn-primary px-4 py-2">
      Back to Home
    </a>
  </div>
</div>
