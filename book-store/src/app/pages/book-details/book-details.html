@if (book) {

  <div class="container py-5">

    <div class="row align-items-start">

      <!-- Image -->
      <div class="col-lg-5">

        <div class="book-image position-relative">

          <img
            [src]="book.image || 'https://placehold.co/400x500'"
            class="img-fluid rounded shadow">

          @if (book.status === 'available') {

            <span class="badge bg-success stock">
              In Stock
            </span>

          } @else {

            <span class="badge bg-danger stock">
              Out Of Stock
            </span>

          }

        </div>

      </div>

      <!-- Details -->

      <div class="col-lg-7">

        <span class="badge bg-warning text-dark mb-3">
          {{ book.category }}
        </span>

        <h1 class="fw-bold">
          {{ book.title }}
        </h1>

        <h4 class="text-muted">
          by {{ book.author }}
        </h4>

        <h2 class="text-success mt-3">

          ${{ book.price }}

        </h2>

        <hr>

        <h5>Description</h5>

        <p>

          {{ book.description }}

        </p>

        <div class="mt-4">

          <button
            class="btn btn-lg me-3"
            [class.btn-dark]="!isInCart()"
            [class.btn-success]="isInCart()"
            [disabled]="isInCart()"
            (click)="addToCart()">

            {{ isInCart() ? 'Added to Cart' : 'Add To Cart' }}

          </button>

          <button
            class="btn btn-lg"
            [class.btn-outline-dark]="!isInWishlist()"
            [class.btn-danger]="isInWishlist()"
            (click)="toggleWishlist()">

            <i class="bi" [class.bi-heart]="!isInWishlist()" [class.bi-heart-fill]="isInWishlist()"></i>

            {{ isInWishlist() ? 'Remove from Wishlist' : 'Add to Wishlist' }}

          </button>

        </div>

      </div>

    </div>

  </div>

} @else {

  <div class="container py-5 text-center">

    <h5 class="fw-bold text-primary">
      Book not found
    </h5>

    <a routerLink="/home" class="btn btn-primary mt-3">
      Back to Home
    </a>

  </div>

}
