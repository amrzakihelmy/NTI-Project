<div class="page-shell">
<app-nav></app-nav>

<div class="page-content container py-5">

  <h2 class="mb-4 text-primary fw-bold">
    Latest Books
  </h2>

  <div class="row g-4">

    @for (book of getBooks(); track book.id) {

      <div class="col-12 col-sm-6 col-md-4 col-lg-3">

        <div class="card shadow h-100">

          <img
            [src]="book.image || 'https://placehold.co/300x350'"
            class="card-img-top"
            [alt]="book.title">

          <div class="card-body d-flex flex-column">

            <h5>{{ book.title }}</h5>

            <p class="text-muted">
              {{ book.author }}
            </p>

            <h4 class="text-success">
              ${{ book.price }}
            </h4>

            <button
              class="btn btn-primary w-100 mb-2"
              [routerLink]="['/books', book.id]">
              View Details
            </button>

            <button
              class="btn w-100 mb-2"
              [class.btn-dark]="!isInCart(book.id)"
              [class.btn-success]="isInCart(book.id)"
              [disabled]="isInCart(book.id)"
              (click)="addToCart(book.id)">

              <i class="bi" [class.bi-cart-plus]="!isInCart(book.id)" [class.bi-cart-check]="isInCart(book.id)"></i>
              {{ isInCart(book.id) ? 'Added to Cart' : 'Add to Cart' }}

            </button>

            <button
              class="btn w-100"
              [class.btn-outline-danger]="!isInWishlist(book.id)"
              [class.btn-danger]="isInWishlist(book.id)"
              (click)="toggleWishlist(book.id)">

              <i class="bi" [class.bi-heart]="!isInWishlist(book.id)" [class.bi-heart-fill]="isInWishlist(book.id)"></i>

              {{ isInWishlist(book.id) ? 'Remove from Wishlist' : 'Add to Wishlist' }}

            </button>

          </div>

        </div>

      </div>

    } @empty {

      <div class="col-12 text-center py-5">

        <h5 class="fw-bold text-primary">
          {{ hasActiveSearch() ? 'No books match your search' : 'No books available yet' }}
        </h5>

      </div>

    }

  </div>

</div>

<app-footer></app-footer>
</div>
