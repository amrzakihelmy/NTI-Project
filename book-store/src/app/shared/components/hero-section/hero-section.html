@if (featuredBook) {

<section class="hero py-5">

    <div class="container">

        <div class="row align-items-center gy-5">

            <div class="col-lg-7">

                <span
                    class="badge rounded-pill px-3 py-2 mb-3"
                    style="background-color: rgba(210,180,140,.2); color: var(--secondary);">

                    ⭐ Featured Book

                </span>

                <h1 class="fw-bold text-main mt-3">

                    {{ featuredBook.title }}

                </h1>

                <h4 class="text-secondary-custom mb-3">

                    by {{ featuredBook.author }}

                </h4>

                <span class="badge bg-secondary mb-4">

                    {{ featuredBook.category }}

                </span>

                <p class="text-secondary-custom fs-5 lh-lg pe-lg-5">

                    {{ featuredBook.description }}

                </p>

                <div class="d-flex align-items-center gap-4 mt-5">

                    <h2 class="fw-bold text-main m-0">

                        ${{ featuredBook.price }}

                    </h2>

                    @if (!authService.isLoggedIn()) {

                        <button
                            class="btn btn-primary px-4 py-2"
                            routerLink="/login">

                            Login to Buy

                        </button>

                    } @else {

                        <button
                            class="btn btn-primary px-4 py-2"
                            [routerLink]="['/books', featuredBook.id]">

                            View Details

                        </button>

                    }

                </div>

            </div>

            <div class="col-lg-5 text-center">

                <img
                    [src]="featuredBook.image"
                    class="img-fluid rounded-4 shadow hero-img"
                    [alt]="featuredBook.title">

            </div>

        </div>

    </div>

</section>

}
