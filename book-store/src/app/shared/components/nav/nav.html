<nav class="navbar navbar-expand-lg navbar">
  <div
    class="container-fluid d-flex flex-wrap align-items-center justify-content-center justify-content-lg-between gap-2 m-2">

    <app-logo></app-logo>

    <div class="d-flex align-items-center flex-grow-1 order-3 order-lg-0">
      <input
        class="form-control mx-lg-5 my-2 my-lg-0"
        type="search"
        placeholder="🔍 Search books ,authors ...."
        aria-label="Search"
        name="searchTerm"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearch()">
    </div>

    @if (isLogged===false){
      <button class="btn btn-secondry m-2" routerLink="/login">Log in</button>
      <button class="btn btn-primary m-2" routerLink="/sign-up">Sign up</button>
    }
    @else{

      <a routerLink="/wishlist" class="nav-link position-relative me-3">
        <i class="bi bi-heart"></i>
      </a>

      <a routerLink="/cart" class="nav-link position-relative">
        <i class="bi bi-cart3"></i>

        @if (getCartCount() > 0) {
          <span class="badge bg-danger position-absolute top-0 start-100 translate-middle">
            {{ getCartCount() }}
          </span>
        }
      </a>

      <button class="btn btn-danger m-2"  (click)="logOut()"routerLink="/login">
        Log out
      </button>
    }

    <div class="d-flex ms-lg-5">
      <a class="theme-toggle" role="button" (click)="toggleTheme()">
        @if (currentTheme === 'light') {
          <i class="bi bi-moon"></i>
        } @else {
          <i class="bi bi-sun"></i>
        }
      </a>
    </div>

  </div>
</nav>
